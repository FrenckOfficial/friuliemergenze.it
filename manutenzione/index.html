<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>Manutenzione in corso | Friuli Emergenze</title>
    <style>
      #donate-float {
        position: fixed !important;
        bottom: 2rem !important;
        left: 2rem !important;
        z-index: 999999 !important;
        animation: slideInUp 0.5s ease-out;
      }

      .donate-btn {
        display: flex !important;
        align-items: center !important;
        gap: 0.5rem;
        padding: 0.875rem 1.5rem;
        background: #ff7b00 !important;
        color: white !important;
        border: none !important;
        border-radius: 50px !important;
        font-weight: 600 !important;
        font-size: 1rem !important;
        cursor: pointer !important;
        box-shadow: 0 4px 12px rgba(255, 123, 0, 0.3) !important;
        transition: all 0.3s ease !important;
        font-family: 'Lexend', sans-serif !important;
        text-decoration: none !important;
      }

      .donate-btn:hover {
        background: #ff6800 !important;
        transform: scale(1.05) !important;
        box-shadow: 0 6px 16px rgba(255, 123, 0, 0.4) !important;
      }

      @keyframes slideInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .donate-float { bottom: 1rem !important; left: 1rem !important; }
        .donate-btn { padding: 0.75rem 1rem !important; font-size: 0.95rem !important; }
      }
    </style>
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="/assets/logo.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <div id="donate-float" style="position: fixed !important; bottom: 2rem !important; left: 2rem !important; z-index: 999999 !important; display: block !important; width: auto !important; height: auto !important;">
      <a href="https://www.friuliemergenze.it/sostienici/donate" 
        target="_blank" 
        rel="noopener noreferrer"
        class="donate-btn"
        style="display: flex !important; align-items: center !important; gap: 0.5rem; padding: 0.875rem 1.5rem; background: #ff7b00 !important; color: white; border: none; border-radius: 50px; font-weight: 600; font-size: 1rem; cursor: pointer; text-decoration: none; font-family: Lexend, sans-serif;">
        <span style="font-size: 1.2rem;">❤️</span>
        Sostieni
      </a>
    </div>
    <div class="container-404">
        <img src="/assets/logo.png" alt="Friuli Emergenze" class="logo-404">

        <img src="/assets/wip.png" alt="WIP" class="wip-404">

        <h1 class="h1-404"><i class="fa-solid fa-screwdriver-wrench"></i></h1>
        <h2 class="h2-404">Sito in manutenzione</h2>

        <p class="p-404">
            Stiamo effettuando alcuni aggiornamenti per migliorare il servizio.
            Il sito tornerà disponibile in data 30/04/2026 dalle ore 16.
        </p>

        <p class="p-404">
            Grazie per la pazienza 🙏
        </p>

        <a class="a404" href="/" onclick="">
            Riprova
        </a>
    </div>
</body>
</html>
