    <style>
      .filter-spotters {
        text-align: center;
        margin-bottom: 1.5rem;
      }

        <button class="menu-toggle" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </button>

        <ul class="nav-links">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/gallery" class="nav-link active">Galleria</a></li>
          <li><a href="/mediakit" class="nav-link">Media Kit</a></li>
          <li><a href="/spotters" class="nav-link">Spotters</a></li>
          <li><a href="/contact-us" class="nav-link">Contatti</a></li>

            <a href="https://myfrem.friuliemergenze.it" target="_blank" class="nav-icon" data-cmp-ab="2">
              Progetto MyFrEM</a>

          <li>

          </li>
          <li>
            <a href="https://chat.whatsapp.com/DxtvDvxXgWr5XVZ4ZkM4k1?mode=gi_t" target="_blank" class="nav-icon" aria-label="WhatsApp" data-cmp-ab="2"><i class="fab fa-whatsapp"></i></a>
          </li>
        </ul>
      </div>
    </nav>

    <header class="hero">
      <img src="/assets/logo.png" alt="Logo Friuli Emergenze" class="logo" data-cmp-info="10">
      <h1>Galleria</h1>
      <p>Tutti i mezzi fotografati e pubblicati da Friuli Emergenze</p>
    </header>

    <main>
      <section class="filter-buttons">
        <button data-filter="all" class="active">Tutti</button>
        <button data-filter="vvf">Vigili del Fuoco</button>
        <button data-filter="protezione-civile">Protezione Civile</button>
        <button data-filter="soccorso-sanitario">Soccorso Sanitario</button>
        <button data-filter="guardia-costiera">Guardia Costiera</button>
        <button data-filter="carabinieri">Carabinieri</button>
        <button data-filter="guardia-di-finanza">Guardia di Finanza</button>
        <button data-filter="polizia-di-stato">Polizia di Stato</button>
        <button data-filter="polizia-locale">Polizia Locale</button>
        <button data-filter="esercito">Esercito Italiano</button>
      </section>

      <section class="filter-spotters">
        <button data-spotter="all" class="active">Tutti</button>
        <button data-spotter="rescuespotter_ts">rescuespotter_ts</button>
        <button data-spotter="verona_emergency112">verona_emergency112</button>
        <button data-spotter="malcus08">malcus08</button>
        <button data-spotter="s.o.s_italia">s.o.s_italia</button>
        <button data-spotter="s.o.g.i.t._sez._trieste">SOGIT Trieste</button>
      </section>

      <div class="gallery-search">
        <input type="text" id="searchInput" placeholder="Cerca un mezzo..." style="
            width: 100%;
            padding: 0.75rem;
            margin: 1rem 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
          ">
      </div>

      <div class="gallery-count" style="
          text-align: center;
          margin-top: 1rem;
          font-size: 1.2rem;
          font-weight: 600;
          color: #00bcd4;
        ">
        Mezzi totali: <span id="mezziCount">64</span>
      </div>

      <section class="gallery">
        <div class="grid"></div>
      </section>
    </main>

    <footer>
      <p>© 2026 Friuli Emergenze — tutti i diritti riservati</p>
      <p>
        <a href="https://myfrem.friuliemergenze.it/">MyFrEM</a> ·

        <a href="https://www.iubenda.com/privacy-policy/95409163/cookie-policy" class="iubenda-black iubenda-noiframe iubenda-embed" title="Cookie Policy ">Cookie Policy</a><script type="text/javascript">(function (w,d) {var loader = function () {var s = d.createElement("script"), tag = d.getElementsByTagName("script")[0]; s.src="https://cdn.iubenda.com/iubenda.js"; tag.parentNode.insertBefore(s,tag);}; if(w.addEventListener){w.addEventListener("load", loader, false);}else if(w.attachEvent){w.attachEvent("onload", loader);}else{w.onload = loader;}})(window, document);</script> ·
        <a href="https://friuliemergenze.it/contact-us" target="_blank"
          >Contatti</a
        >
      </p>
    </footer>

    <script>
      let activeCategory = "all";
      let activeSpotter = "all";

      fetch("/gallery.json")
        .then((res) => res.json())
        .then((data) => {
          const container = document.querySelector(".grid");

          container.innerHTML = data
            .map(
              (d) => `
      <div class="grid-item" data-category="${d.category}" data-spotter="${d.spotter || ""}">
        <a href="${d.image}" data-lightbox="mezzi">
          <img src="${d.image}" alt="${d.title}">
        </a>
        <p>${d.title}</p>
        <a href="${d.link}" class="btn-scopri">Scopri di più</a>
      </div>
    `,
            )
            .join("");

          applyFilters();
        });

      function applyFilters() {
        const items = document.querySelectorAll(".grid-item");
        let count = 0;

        items.forEach((item) => {
          const cat = item.dataset.category;
          const spot = item.dataset.spotter;

          const okCat = activeCategory === "all" || cat === activeCategory;
          const okSpot = activeSpotter === "all" || spot === activeSpotter;

          if (okCat && okSpot) {
            item.style.display = "block";
            count++;
          } else {
            item.style.display = "none";
          }
        });

        document.getElementById("mezziCount").textContent = count;
      }

      document.querySelectorAll("[data-filter]").forEach((btn) => {
        btn.onclick = () => {
          document
            .querySelectorAll("[data-filter]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activeCategory = btn.dataset.filter;
          applyFilters();
        };
      });

      document.querySelectorAll("[data-spotter]").forEach((btn) => {
        btn.onclick = () => {
          document
            .querySelectorAll("[data-spotter]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activeSpotter = btn.dataset.spotter;
          applyFilters();
        };
      });

      document.getElementById("searchInput").addEventListener("keyup", (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll(".grid-item").forEach((item) => {
          item.style.display = item.textContent.toLowerCase().includes(val)
            ? ""
            : "none";
        });
      });

      document.querySelector(".menu-toggle").onclick = () => {
        document.querySelector(".nav-links").classList.toggle("open");
      };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
  </body>
</html>
